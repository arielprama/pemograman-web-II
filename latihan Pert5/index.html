<style>
/* GLOBAL */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:'Segoe UI',system-ui,sans-serif;color:#e6e6e6;user-select:none}
button{font:inherit;cursor:pointer}
/* 3D WORLD */
#c3d{position:fixed;inset:0}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60}

.panel h4{font-size:10px;letter-spacing:.15em;color:#8f99a4;padding:8px 10px 4px;font-weight:600}
#topbar{top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px 12px;white-space:nowrap}
.title{font-weight:700;letter-spacing:.1em;font-size:12px}
.missions{display:flex;gap:3px}
.mis{padding:3px 7px;border-radius:3px;background:#2a2e33;color:#77808a;font-size:10px;letter-spacing:.05em}
.mis.done{background:#1e4a2c;color:#8fe0a8}.mis.cur{background:#4d3f18;color:#f2cf70}
.mute{background:#2b3036;border:1px solid #444c55;color:#fff;border-radius:4px;padding:3px 8px}
#inv{top:56px;left:10px;width:196px;max-height:calc(100vh - 150px);overflow:auto}
.item{display:flex;justify-content:space-between;padding:5px 10px;cursor:pointer;border-top:1px solid #2a2f34}

#tools{top:56px;right:10px;width:214px;max-height:calc(100vh - 150px);overflow:auto}
.tbtn{display:block;width:calc(100% - 16px);margin:3px 8px;padding:5px 8px;background:#2b3036;color:#dde;border:1px solid #3d444c;border-radius:4px;text-align:left;font-size:11.5px}

.row3{display:flex;gap:4px;margin:3px 8px}.row3 .tbtn{margin:0;width:auto;flex:1;text-align:center}
#bstat{padding:2px 10px 8px;line-height:1.6;color:#b9c1c9;font-size:11px}

.big.power{background:#6e1d1d;border-color:#b33}
#hint{max-width:340px;font-size:11px;color:#c9cfd6;padding:0 8px}
#tip{position:fixed;pointer-events:none;background:rgba(10,11,12,.9);border:1px solid #444;padding:4px 8px;border-radius:4px;font-size:11px;z-index:20;display:none}

.tst.err{background:#2d1616;border-color:#a33;color:#ffb3b3}.tst.info{background:#1c2430;border-color:#4b6d99;color:#cfe0f7}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:40}

#modal pre{font-family:inherit;line-height:1.55}
/* MONITOR UI */
#monitorWorld{position:fixed;inset:0;display:none;z-index:30;background:radial-gradient(ellipse at center,#23262a,#08090a)}
#monHud{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-size:11px;white-space:nowrap}
.stg{padding:3px 9px;border-radius:3px;background:#24282c;color:#6f7780;letter-spacing:.08em}
.stg.on{background:#35557f;color:#fff}
#monStatus{color:#aab;padding:0 8px;font-family:Consolas,monospace}
#bezel{position:absolute;left:50%;top:calc(50% + 18px);transform:translate(-50%,-50%);background:linear-gradient(#141516,#0b0b0c);border-radius:10px;padding:14px 14px 26px;box-shadow:0 0 0 1px #2b2d30,0 30px 80px #000}

#screenBox{position:relative;overflow:hidden;background:#000}
#screen{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;font-family:Consolas,'Courier New',monospace}
.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
.glitch{animation:gl .12s steps(2) infinite}

#s-post,#s-msg{background:#000;color:#c8c8c8;font-size:19px;padding:34px 44px}
#postText{white-space:pre-wrap;line-height:1.45}
.ok{color:#63e27a}.err{color:#ff5a5a}.warn{color:#ffca4f}.dim{color:#777}.hl{color:#fff;background:#333;padding:0 6px}
.postlogo{position:absolute;right:44px;top:34px;text-align:right;color:#9aa;font-size:15px;border:1px solid #444;padding:10px 16px}
.sbtn{background:#1d2a3a;border:1px solid #4a6c94;color:#fff;padding:8px 16px;margin-right:10px;margin-top:18px;font-family:inherit;font-size:16px}
.sbtn:hover{background:#2c4466}
#s-nosig{background:#000}
.osd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #555;background:#101214;padding:26px 40px;text-align:center;font-family:'Segoe UI',sans-serif;color:#ddd}

.bootl{list-style:none;max-width:520px}

.mon span{font-size:11px;color:#8f9aa8;letter-spacing:.1em}
/* OS / INSTALLER */
#s-inst{background:linear-gradient(135deg,#1b3350,#284e72);font-family:'Segoe UI',sans-serif;color:#1d2126}
.iwin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:700px;background:#f3f4f6;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:30px 36px;min-height:360px}
.iwin h2{font-weight:600;font-size:24px;margin-bottom:12px}

.ibtn.sec{background:#d9dde2;color:#222;margin-left:8px}
.disk{border:1px solid #c7ccd3;padding:10px 14px;margin:6px 0;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;background:#fff}
.disk.sel{border-color:#1f6fd1;box-shadow:0 0 0 2px #1f6fd155}
.pbar{height:18px;background:#d9dde2;border-radius:3px;overflow:hidden;margin:14px 0}
.pbar i{display:block;height:100%;width:0;background:#1f6fd1}
.mono{font-family:Consolas,monospace;font-size:14px;white-space:pre}
/* DESKTOP UI */
#s-desk{font-family:'Segoe UI',sans-serif;background:linear-gradient(170deg,#27425a 0%,#4f7690 45%,#b9967a 100%)}
.mtn{position:absolute;bottom:44px;left:0;right:0;height:260px;background:#223445;clip-path:polygon(0 70%,12% 40%,22% 58%,36% 22%,50% 55%,62% 35%,78% 62%,90% 30%,100% 50%,100% 100%,0 100%);opacity:.85}
.mtn.b{height:170px;background:#172431;clip-path:polygon(0 60%,18% 30%,30% 55%,48% 25%,66% 60%,80% 40%,100% 65%,100% 100%,0 100%)}
#icons{position:absolute;left:16px;top:16px;display:grid;grid-template-rows:repeat(6,92px);gap:4px}
.ico{width:84px;text-align:center;color:#fff;font-size:12px;cursor:pointer;padding:6px 2px;border-radius:5px;text-shadow:0 1px 3px #000}
.ico:hover{background:rgba(255,255,255,.14)}
.ico i{display:block;width:46px;height:46px;margin:0 auto 6px;border-radius:9px;font-style:normal;font-size:22px;line-height:46px;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
#wins{position:absolute;inset:0 0 44px 0;pointer-events:none}
.win{position:absolute;background:#f4f5f7;color:#1c1f24;border-radius:8px;box-shadow:0 14px 44px rgba(0,0,0,.5);border:1px solid #8a939e;pointer-events:auto;overflow:hidden;display:flex;flex-direction:column}
.win .tb{height:34px;background:#e2e5e9;display:flex;align-items:center;padding:0 6px 0 12px;cursor:move;font-size:13px;font-weight:600;flex:none}
.win .tb span{flex:1}
.win .tb button{border:none;background:none;width:30px;height:26px;font-size:15px;border-radius:4px}
.win .tb button:hover{background:#e0474c;color:#fff}
.win .wc{flex:1;overflow:auto;padding:14px;font-size:13px}
.win.dark{background:#1b1e22;color:#dde2e8}.win.dark .tb{background:#2a2e34;color:#eee}
#taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(18,20,24,.93);display:flex;align-items:center;padding:0 8px;gap:6px;color:#fff;font-size:12px}
.tbb{background:rgba(255,255,255,.07);border:none;color:#fff;height:34px;padding:0 12px;border-radius:5px;font-size:12px}
.tbb:hover{background:rgba(255,255,255,.16)}
#tray{margin-left:auto;display:flex;gap:16px;padding-right:10px;font-family:Consolas,monospace}
#startMenu{position:absolute;left:8px;bottom:50px;width:260px;background:#1f2328;border-radius:8px;padding:8px;display:none;box-shadow:0 10px 30px #000;color:#fff;font-size:13px}
#startMenu div{padding:9px 12px;border-radius:4px;cursor:pointer}#startMenu div:hover{background:#2f353d}
.notif{position:absolute;right:14px;bottom:56px;background:#23272d;color:#fff;border-left:4px solid #3a8ee6;padding:10px 14px;border-radius:4px;font-size:13px;box-shadow:0 8px 20px #0008;max-width:340px}
.notif.err{border-color:#e04545}
.tabs{display:flex;gap:2px;margin-bottom:10px}
.tabs span{padding:6px 14px;background:#dde1e6;cursor:pointer;border-radius:4px 4px 0 0;font-size:12px}
.tabs span.on{background:#1f6fd1;color:#fff}
table.it{border-collapse:collapse;width:100%}
table.it td{padding:6px 8px;border-bottom:1px solid #d5d9de}
table.it td:first-child{color:#5b6570;width:44%}
.bar{height:16px;background:#2b3037;border-radius:2px;overflow:hidden;margin:3px 0 10px}
.bar i{display:block;height:100%;background:#3a8ee6;transition:width .15s}
.sval{font-family:Consolas,monospace;font-size:20px;color:#fff}
.warnb{background:#8a1c1c;color:#fff;padding:8px;text-align:center;font-weight:700;letter-spacing:.1em;animation:bl .5s infinite alternate;margin:6px 0}
@keyframes bl{to{background:#d42b2b}}
/* GAME UI */
.gamewrap{display:flex;gap:12px}
.gamewrap canvas{background:#000;border-radius:3px;display:block}
.gside{width:170px;font-size:12px;line-height:1.6;color:#c5ccd4}
.gside b{color:#fff}
/* BSOD */
#s-bsod{background:#0a5ec0;color:#fff;font-family:'Segoe UI',sans-serif;padding:110px 140px}
#s-bsod h1{font-size:120px;font-weight:300;margin-bottom:20px}
#s-bsod p{font-size:24px;max-width:900px;line-height:1.4}
/* RESPONSIVE */
@media (max-width:900px){#inv,#tools{width:160px;font-size:11px}#hint{display:none}.title{display:none}}
</style>

<body>

<!-- 3D ROOM -->
<div id="c3d"></div>
<div id="fade"></div>

<!-- HARDWARE BUILD HUD -->
<div id="topbar" class="panel"><span class="title">PC BUILD TO OS</span><div class="missions" id="mis1"></div><button class="mute" data-act="mute">🔊</button></div>
<div id="inv" class="panel"><h4>INVENTORY</h4><div id="invList"></div></div>
<div id="tools" class="panel">
  <h4>BUILD STATUS</h4><div id="bstat"></div>
  <h4>TOOLS</h4>
  <button class="tbtn on" data-mode="hand">✋ Tangan — ambil & pasang</button>
  <button class="tbtn" data-mode="remove">⤴ Lepas komponen / kabel</button>
  <button class="tbtn" data-act="rotate">⟳ Putar CPU (R)</button>
  <h4>KAMERA</h4>
  <div class="row3"><button class="tbtn" data-cam="case">Casing</button><button class="tbtn" data-cam="desk">Meja</button><button class="tbtn" data-cam="room">Ruangan</button></div>
  <h4>CABLES</h4><div id="cableList"></div>
</div>
<div id="bottom" class="panel"><div id="hint"></div><button class="big" data-act="check">CHECK BUILD</button><button class="big power" data-act="power">⏻ POWER</button></div>
<div id="tip"></div><div id="toast"></div>
<div id="modal"><div class="box"><pre id="modalText"></pre><button class="big" style="margin-top:14px" data-act="closeModal">OK</button></div></div>

<!-- MONITOR -->
<div id="monitorWorld">
  <div id="monHud" class="panel" style="position:absolute;padding:5px 10px">
    <span class="stg" data-stg="POST">POST</span><span class="stg" data-stg="BIOS">BIOS</span><span class="stg" data-stg="OS">OS</span><span class="stg" data-stg="DESKTOP">DESKTOP</span>
    <span id="monStatus">STATUS —</span><div class="missions" id="mis2"></div>
    <button class="mute" data-act="mute">🔊</button><button class="mute" data-act="exitRoom">⏻ Matikan & kembali ke ruangan</button>

  <div id="bezel"><div id="screenBox"><div id="screen">

    <div class="scr" id="s-nosig"><div class="osd"><h2>NO DISPLAY SIGNAL</h2><div>HDMI 1 — tidak ada sinyal video</div><div id="nosigHint" style="margin-top:12px;color:#f3c35b;font-size:14px"></div><button class="sbtn" data-act="exitRoom" style="font-family:Segoe UI">Matikan PC & periksa hardware</button></div></div>
    <!-- POST -->
    <div class="scr" id="s-post"><div class="postlogo">VIRTUAL MEGATRENDS<br>UEFI FIRMWARE v2.21</div><div id="postText"></div><div id="postAct"></div></div>

    <div class="scr" id="s-bios"></div>

    <div class="scr" id="s-msg"><div id="msgText" style="white-space:pre-wrap;line-height:1.5"></div><div id="msgAct"></div></div>
    <div class="scr" id="s-inst"></div>
    <!-- DESKTOP + APPS + GAME -->
    <div class="scr" id="s-desk"><div class="mtn"></div><div class="mtn b"></div><div id="icons"></div><div id="wins"></div><div id="startMenu"></div>
      <div id="taskbar"><button class="tbb" data-act="start" style="font-weight:700">◆ VirtuOS</button><div id="tbApps" style="display:flex;gap:4px"></div><div id="tray"><span id="trayTemp"></span><span id="trayClock"></span></div></div>
    </div>
    <!-- BSOD -->
    <div class="scr" id="s-bsod"></div>
  </div></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);

// ===============================
// GLOBAL SYSTEM STATE
// ===============================
const S={
  standoffs:false, mbInstalled:false, cpuInstalled:false, thermalPaste:false, coolerInstalled:false,
  ramSlots:{A1:null,A2:null,B1:null,B2:null}, nvmeInstalled:false, hddInstalled:false, psuInstalled:false,
  gpuInstalled:null, gpuType:'INTEGRATED',
  cables:{ATX24:false,EPS8:false,PCIE:false,PWRSW:false,SATA_DATA:false,SATA_PWR:false,HDMI:null,USB:false},
  bootPriority:['NVME','HDD','USB'], xmp:false, rebar:false, svm:true,
  fanCurve:[[40,30],[60,50],[80,80],[90,100]],
  osInstalled:false, osDisk:null,
  powered:false, cpuLoad:0.03, gpuLoad:0.02, temp:27, fan:0.3, clock:3.8, maxTemp:0, hotTime:0, warned:false,
  progress:{build:false,post:false,bios:false,os:false,system:false,game:false},
  bench:null, gameFps:null, stage:'ROOM'
};
const CPU={brand:'AMD',name:'AMD Ryzen 7 5700G',arch:'Zen 3 "Cezanne" — 7nm TSMC',isa:'x86-64 (SSE4.2, AVX2, FMA3, AES-NI)',cores:8,threads:16,base:3.8,boost:4.6,l1:'512 KB (8 × 32KB I + 32KB D)',l2:'4 MB (8 × 512 KB)',l3:'16 MB (shared)',socket:'AM4',tdp:'65 W'};
const GPUS={
  INTEGRATED:{name:'AMD Radeon Vega 8 (Integrated)',type:'Integrated GPU (di dalam CPU)',vram:'512 MB (shared system RAM)',bus:'Shared memory controller',bw:()=>memBW().toFixed(1)+' GB/s (dibagi dengan CPU)',raw:26,score:1300,power:false,arch:'GCN 5.0 — 7nm'},
  HIGH_END:{name:'NVIDIA GeForce RTX 3070',type:'Dedicated GPU',vram:'8 GB GDDR6',bus:'256-bit',bw:()=>'448 GB/s',raw:64,score:10500,power:true,arch:'Ampere — 8nm'},
  MID:{name:'NVIDIA GeForce GTX 1650',type:'Dedicated GPU',vram:'4 GB GDDR5',bus:'128-bit',bw:()=>'128 GB/s',raw:44,score:4300,power:false,arch:'Turing — 12nm'}
};
const DISKS={NVME:{name:'NVMe M.2 SSD 512GB',type:'NVMe SSD',iface:'PCIe 3.0 x4 (NVMe 1.4)',speed:3500,size:512},HDD:{name:'SATA HDD 1TB 7200RPM',type:'Hard Disk Drive',iface:'SATA III 6Gb/s (AHCI)',speed:160,size:1000},USB:{name:'USB INSTALLER (VirtuOS 11)'},OSBM:{name:'VirtuOS Boot Manager'}};
const ramCount=()=>Object.values(S.ramSlots).filter(Boolean).length;
const isDual=()=>ramCount()===2&&S.ramSlots.A2&&S.ramSlots.B2;
const memFreq=()=>S.xmp?3600:2133;
const memBW=()=>memFreq()*8*(isDual()?2:1)/1000;
const hddOK=()=>S.hddInstalled&&S.cables.SATA_DATA&&S.cables.SATA_PWR;
const present=d=>d==='USB'?S.cables.USB:d==='NVME'?S.nvmeInstalled:d==='HDD'?hddOK():d==='OSBM'?(S.osInstalled&&present(S.osDisk)):false;
